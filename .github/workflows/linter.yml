name: "CI: Lint and Static Checks"
"on":
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check-super-linter:
    name: Run Super-Linter Validation
    permissions:
      contents: read
      issues: write
    uses: electrocucaracha/gh-workflows/.github/workflows/linter.yml@8f0fa8c0acf90de07569a66d774498c3101d235f
    secrets:
      COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
