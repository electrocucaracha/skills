name: "CI: Lint and Static Checks"
"on":
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate-skill-evals:
    name: Validate skill evals
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate eval files
        run: make lint-evals
  check-super-linter:
    name: Run Super-Linter Validation
    permissions:
      contents: read
      issues: write
    uses: electrocucaracha/gh-workflows/.github/workflows/linter.yml@71e4e96b50b203c2b8e7d680859c5c3136d8acc3 # v14.1.1
    secrets:
      COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
